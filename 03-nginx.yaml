- name: install nginx and run
  hosts: web
  tasks: #list of tasks to be performed in this play
  - name: install nginx
    ansible.builtin.package:
      name: nginx            #name: package name is mandatory parameter
      state: present         #state: present to install, absent to remove
  - name: run nginx
    ansible.builtin.service:
      name: nginx             #service name: nginx 
      state: started    #state can be started, stopped, restarted, reloaded 