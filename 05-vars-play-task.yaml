- name: play-level and task-level variables
  hosts: web
  vars:
    COURSE: "DEVOPS"
    TRAINER: "Siva Kumar"
    DURATION: "120 Hours"
  tasks:
  - name: Print the task vars info
    vars:
      COURSE: "ANSIBLE" #task level var can override play levl var
    ansible.builtin.debug:
      msg: "Hi, I'm Learning course:{{ COURSE }}, from trainer: {{ TRAINER }}, Duration: {{ DURATION }}"

  - name: Print the play-level vars 
    ansible.builtin.debug:
      msg: "Hi, I'm Learning Course: {{ COURSE }}, from trainer: {{ TRAINER }}, Duration: {{ DURATION }}"
      