- name: variables to print
  hosts: web
  vars:
    COURSE: "Devops With AWS"
    TRAINER: "Siva Kumar"
    DURATION: "120 HOURS"
  tasks:
  - name: print the variable- play level
    ansible.builtin.debug:
      msg: "Hi, I'm learning course: {{ COURSE }}, from Trainer: {{ TRAINER }}, Duration: {{ DURATION }}"
