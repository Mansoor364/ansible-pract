- name: vars from prompt
  hosts: web
  vars_prompt:
  - name: COURSE
    prompt: Please enter course name
    private: false
  - name: TRAINER
    prompt: Please enter trainer name
    private: false
  - name: DURATION
    prompt: please enter duration time
    private: false
  tasks:
  - name: print vars from prompt
    ansible.builtin.debug:
      msg: "Hi, I'm learning {{COURSE}}, From Trainer:{{TRAINER}}, Duration:{{DURATION}}"
      