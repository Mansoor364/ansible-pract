- name: vars from prompt
  hosts: web
  vars_prompt:
  - name: COURSE
    prompt: please enter course name
  - name: TRAINER
    prompt: please enter trainer name
  - name: DURATION
    prompt: please enter Duration name
  tasks:
  - name: vars from prompt
    ansible.builtin.debug:
      msg: "Hi, I'm learning course: {{ COURSE }}, From trainer:{{ TRAINER }}, Duration:{{ DURATION }}"
      