- name: vars priority
  hosts: web
  vars:
    COURSE: "PLAY-LEVEL-VAR"
  vars_files:
  - vars.yaml
  vars_prompt:
  - name: COURSE
    prompt: please enter course name
  tasks:
  - name: print variables on preference
    vars:
      COURSE: "TASK-LEVEL-VAR"
    ansible.builtin.debug:
      msg: "Hi, I'm learning: {{ COURSE }}"


#variable printing priority or preference is 
#1)vars passed as arguments on terminal
#2)vars at task level 
#3)vars from file
#4)vars passed as prompt
#5)vars at play level
#6)vars in inventory file
