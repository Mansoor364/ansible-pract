- name: install nginx 
  hosts: web
  become: yes
  tasks:
  - name: gather facts
    ansibe.builtin.debug:
      msg: "facts are: {{ ansible_facts }}"
  - name: install nginx if os is redhat
    ansible.builtin.dnf:
      name: nginx
      state: present
    when: ansible_os_family == "RedHat"
  - name: install nginx if os is debian/ubuntu
    ansible.builtin.apt:
      name: nginx
      state: present
    when: ansible_os_family == "Debian"
    